# NIM LLM Model Catalog
#
# Each line defines one model available for pulling and serving.
# Format: model_key | docker_uri | sif_name | description | extra_env
#
# To add a new model, append a line following the same format.
# All scripts read this file — no code changes needed.
#
# model_key        Unique short name used in CLI commands
# docker_uri       Full image path including tag on nvcr.io
# sif_name         Local .sif filename in $NIM_BASE_DIR/containers/images/
# description      Human-readable description shown in --list output
# extra_env        Optional: extra --env flags for singularity exec (empty = none)

