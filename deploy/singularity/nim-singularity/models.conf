# NIM LLM Model Catalog
#
# Each line defines one model available for pulling and serving.
# Format: model_key | docker_uri | sif_name | description | extra_args | backend
#
# To add a new model, append a line following the same format.
# All scripts read this file — no code changes needed.
#
# model_key        Unique short name used in CLI commands
# docker_uri       Full image path including tag (nvcr.io or Docker Hub)
# sif_name         Local .sif filename in $NIM_BASE_DIR/containers/images/
# description      Human-readable description shown in --list output
# extra_args       Backend-specific: env vars for NIM, CLI args for vLLM (empty = none)
# backend          nim (default) or vllm
#
# vLLM backend:
#   For models without a compatible NIM container (e.g., R550 driver limitation).
#   Multiple models can share the same vLLM SIF. Pre-downloaded HF weights required
#   (see download-nim-model.sh). extra_args are passed as CLI args to vllm serve.

# --- Model-specific NIM containers ---
nemotron-49b   | nvcr.io/nim/nvidia/llama-3.3-nemotron-super-49b-v1.5:1.14.0 | nim-llm-nemotron-49b.sif         | Nemotron Super 49B (dense, TP=2)  | NIM_PASSTHROUGH_ARGS=--disable-custom-all-reduce --compilation-config '{"pass_config": {"fuse_allreduce_rms": false}}' | nim
nemotron3-120b | nvcr.io/nim/nvidia/nemotron-3-super-120b-a12b:1.8.1          | nim-llm-nemotron3-120b-1.8.1.sif | Nemotron-3 Super 120B MoE         | NIM_MAX_MODEL_LEN=32768 | nim

