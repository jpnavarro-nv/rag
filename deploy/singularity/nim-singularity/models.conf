qwen3-122b     | vllm/vllm-openai:v0.17.0 | vllm-openai-0.17.0.sif | Qwen 3.5 122B-A10B MoE    | --max-model-len 32768 --served-model-name Qwen/Qwen3.5-122B-A10B | vllm
