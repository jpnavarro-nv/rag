# NIM LLM Model Catalog
#
# Each line defines one model available for pulling and serving.
# Format: model_key | docker_uri | sif_name | description | extra_env
#
# To add a new model, append a line following the same format.
# All scripts read this file — no code changes needed.
#
# model_key        Unique short name used in CLI commands
# docker_uri       Full image path including tag on nvcr.io
# sif_name         Local .sif filename in $NIM_BASE_DIR/containers/images/
# description      Human-readable description shown in --list output
# extra_env        Optional: extra --env flags for singularity exec (empty = none)
#
# Generic NIM container (nvcr.io/nim/nvidia/llm-nim):
#   Models that lack a compatible model-specific NIM for the cluster (e.g., R550
#   driver) can use the generic NIM container with NIM_MODEL_NAME in extra_env.
#   Multiple models can share the same SIF (nim-llm-generic-<ver>.sif).

# --- Model-specific NIM containers ---
nemotron-49b   | nvcr.io/nim/nvidia/llama-3.3-nemotron-super-49b-v1.5:1.14.0 | nim-llm-nemotron-49b.sif         | Nemotron Super 49B (dense, TP=2) | NIM_PASSTHROUGH_ARGS=--disable-custom-all-reduce --compilation-config '{"pass_config": {"fuse_allreduce_rms": false}}'
qwen3-122b     | nvcr.io/nim/qwen/qwen3.5-122b-a10b:latest                   | nim-llm-qwen3-122b.sif           | Qwen 3.5 122B-A10B MoE |
nemotron3-120b | nvcr.io/nim/nvidia/nemotron-3-super-120b-a12b:1.8.1          | nim-llm-nemotron3-120b-1.8.1.sif | Nemotron-3 Super 120B MoE | NIM_MAX_MODEL_LEN=32768

# --- Generic NIM 1.11.0 (R550-compatible, shared SIF) ---
gpt-oss-120b   | nvcr.io/nim/nvidia/llm-nim:1.11.0 | nim-llm-generic-1.11.0.sif | GPT-OSS 120B via generic NIM 1.11 | NIM_MODEL_NAME=openai/gpt-oss-120b
