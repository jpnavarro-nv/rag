# LLM Model Catalog — vLLM Backend
#
# Each line defines one model available for pulling and serving.
# Format: model_key | docker_uri | sif_name | description | extra_args
#
# To add a new model, append a line following the same format.
# All scripts read this file — no code changes needed.
#
# model_key        Unique short name used in CLI commands
# docker_uri       Full image path including tag (Docker Hub vLLM images)
# sif_name         Local .sif filename in $LLM_BASE_DIR/containers/images/
# description      Human-readable description shown in --list output
# extra_args       CLI args passed to vllm serve (empty = none)
#
# All models use vLLM standalone with pre-downloaded HuggingFace weights
# (see download-llm-model.sh). Multiple models can share the same SIF.

