# Cluster: Gaia (CENPES/Petrobras)
# Hardware: 4x A100 80GB per node
# Driver: R550, CUDA 12.9 (via forward compat)

RAG_BASE_DIR="${RAG_BASE_DIR:-/gaia/finetune-llm/rag/runtime}"
SLURM_PARTITION="gpu"
SLURM_ACCOUNT="llm-tic"
SLURM_GPUS_PER_NODE=4
