# Minimal Milvus configuration for Singularity deployment
# Based on default config from milvusdb/milvus:v2.5.3-gpu

# etcd configuration
etcd:
  endpoints: localhost:2379
  rootPath: by-dev

# MinIO/S3 configuration
minio:
  address: localhost
  port: 9010
  accessKeyID: minioadmin
  secretAccessKey: minioadmin
  useSSL: false
  bucketName: a-bucket

# Message Queue - Use embedded RocksMQ instead of Kafka for standalone mode
mq:
  type: rocksmq

# Proxy is the main entry point for clients - bind to all interfaces
proxy:
  grpc:
    serverAddress: 0.0.0.0
  port: 19530

# Logging
log:
  level: info
  format: text

# Storage
common:
  storageType: remote
