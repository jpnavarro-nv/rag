# Minimal Milvus configuration for Singularity deployment
# Based on default config from milvusdb/milvus:v2.5.3-gpu

# etcd configuration
etcd:
  endpoints: localhost:2379
  rootPath: by-dev

# MinIO/S3 configuration
minio:
  address: localhost
  port: 9010
  accessKeyID: minioadmin
  secretAccessKey: minioadmin
  useSSL: false
  bucketName: a-bucket

# Message Queue - Use embedded RocksMQ instead of Kafka for standalone mode
mq:
  type: rocksmq

# RocksMQ data path (inside the mounted /var/lib/milvus directory)
rocksmq:
  path: /var/lib/milvus/rdb_data

# Local storage path for QueryNode cache (mmap, chunk cache, disk indexes)
localStorage:
  path: /var/lib/milvus/data/

# Component ports (must be different to avoid conflicts in standalone mode)
rootCoord:
  address: 0.0.0.0
  port: 53100

dataCoord:
  address: 0.0.0.0
  port: 13333

queryCoord:
  address: 0.0.0.0
  port: 19531

queryNode:
  port: 21123

indexNode:
  port: 21121

dataNode:
  port: 21124

# Proxy is the main entry point for clients - bind to all interfaces
proxy:
  grpc:
    serverAddress: 0.0.0.0
  port: 19530

# Logging
log:
  level: info
  format: text

# Storage
common:
  storageType: remote
