name: Build nim-tools container

on:
  push:
    branches: [nim-singularity, main]
    paths:
      - 'deploy/singularity/nim-singularity/Dockerfile.nim-tools'
      - '.github/workflows/build-nim-tools.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: deploy/singularity/nim-singularity
          file: deploy/singularity/nim-singularity/Dockerfile.nim-tools
          push: true
          tags: ghcr.io/jpnavarro-nv/nim-tools:latest
